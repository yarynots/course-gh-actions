name: upperbuildworkflow

on:
  push:
    paths:
      - ".github/workflows/upper-buildv1.yml"
      - "upper/**"
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: pwd && ls -al
      - uses: actions/checkout@v4
      - run: pwd && ls -al  
      - run: go version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go version
      - run: |
        ls
        go build
        ls
        go test
        ./upper food the bar    
  
