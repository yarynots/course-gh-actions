name: upperbuildworkflow

on:
  push:
    paths:
      - ".github/workflows/upper-buildv1.yml"
      - "upper/**"
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macos-latest
    steps:
      - run: pwd && ls -al
      - uses: actions/checkout@v4
      - run: pwd && ls -al  
      - run: go version
      - uses: actions/setup-go@v5
        with:
          go-version-file: upper/go.mod
          cache-dependency-path: upper/go.sum
      - run: go mod download
        working-directory: upper
      - run: |
          ls
          go build
          ls
          go test
          ./upper food the bar
        working-directory: upper
  
